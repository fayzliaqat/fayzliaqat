name: Generate Contribution Graphics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/build_contribution_activity.py"

permissions:
  contents: write

concurrency:
  group: contribution-graphics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out graphics builder
        uses: actions/checkout@v4

      - name: Prepare writable output directory
        run: mkdir -p dist

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: fayzliaqat
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Build static activity calendars
        run: python3 scripts/build_contribution_activity.py

      - name: Publish contribution graphics
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
